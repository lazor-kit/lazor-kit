name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the v1 writer's web and mobile copies are identical
        run: node scripts/check-txv1-identical.mjs

      - name: Typecheck (web SDK)
        run: pnpm --filter @lazorkit/wallet typecheck

      - name: Build all publishable packages
        run: |
          pnpm --filter @lazorkit/sdk-legacy build
          pnpm --filter @lazorkit/wallet build
          pnpm --filter @lazorkit/wallet-mobile-adapter build

      - name: Test the built web SDK and mobile adapter
        run: |
          pnpm --filter @lazorkit/wallet test
          pnpm --filter @lazorkit/wallet-mobile-adapter test

      - name: Verify web SDK dist
        run: |
          test -f packages/react/dist/index.js
          test -f packages/react/dist/index.mjs
          test -f packages/react/dist/index.d.ts

      - name: Verify mobile adapter dist
        run: |
          test -f packages/react-native/dist/index.js
          test -f packages/react-native/dist/index.esm.js
          test -f packages/react-native/dist/index.d.ts

      - name: Verify legacy SDK dist
        run: |
          test -f packages/program-sdk/legacy/dist/index.js
          test -f packages/program-sdk/legacy/dist/index.d.ts

      - name: Pack web SDK (smoke test)
        working-directory: packages/react
        run: npm pack --dry-run

      - name: Pack mobile adapter (smoke test)
        working-directory: packages/react-native
        run: npm pack --dry-run

      - name: Upload web SDK dist
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: lazorkit-wallet-dist
          path: packages/react/dist
          retention-days: 7

      - name: Upload mobile adapter dist
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: lazorkit-wallet-mobile-adapter-dist
          path: packages/react-native/dist
          retention-days: 7

  txv1-oracle:
    # The v1 writer against @solana/kit 8.4.0 and @solana/web3.js 1.99.0: the
    # golden vectors and the 10,000-case differential. kit 8 needs Node 20.18+.
    name: txv1 oracle (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Golden vectors are up to date
        run: node scripts/txv1-vectors.mjs --check

      - name: Oracle and differential tests
        run: pnpm --filter txv1-oracle test
